<!DOCTYPE html>
<html data-theme="light">
<head>
    <title>{% block title %}Admin Portal{% endblock %}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Manrope:wght@400;500;600&display=swap"
    />
    <style>
        :root {
            --ink: #0c0d0f;
            --muted: #5b5f66;
            --accent: #ff6f3d;
            --surface: #ffffff;
            --stroke: #e7e3df;
            --bg: #f8f4ef;
            --glow-a: #ffe8db;
            --glow-b: #e8f4ff;
        }
        [data-theme="dark"] {
            --ink: #f4f6f8;
            --muted: #b7bdc5;
            --accent: #ff8a5b;
            --surface: #14181c;
            --stroke: #2a2f36;
            --bg: #0c0f12;
            --glow-a: rgba(255, 111, 61, 0.22);
            --glow-b: rgba(93, 173, 255, 0.2);
        }
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            font-family: "Manrope", sans-serif;
            color: var(--ink);
            background: radial-gradient(900px 480px at 15% -5%, var(--glow-a) 0, transparent 62%),
                radial-gradient(700px 420px at 90% 8%, var(--glow-b) 0, transparent 60%),
                var(--bg);
        }
        a {
            color: inherit;
            text-decoration: none;
        }
        .page {
            max-width: 1200px;
            margin: 0 auto;
            padding: 28px 24px 60px;
        }
        .nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            position: sticky;
            top: 0;
            z-index: 20;
            background: linear-gradient(120deg, rgba(255, 255, 255, 0.9), rgba(255, 255, 255, 0.76));
            backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            border-radius: 18px;
            box-shadow: 0 12px 28px rgba(15, 23, 42, 0.12);
            margin-bottom: 24px;
        }
        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-family: "Space Grotesk", sans-serif;
            font-weight: 700;
            font-size: 20px;
        }
        .brand-badge {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            background: linear-gradient(135deg, #ff7a3c, #ff5b2e 55%, #ef4444);
            display: grid;
            place-items: center;
            color: #fff;
            font-size: 16px;
            box-shadow: 0 10px 18px rgba(255, 111, 61, 0.34);
        }
        .nav-links {
            display: flex;
            gap: 16px;
            align-items: center;
            font-size: 14px;
            color: var(--muted);
        }
        .nav-links a {
            padding-bottom: 2px;
            border-bottom: 2px solid transparent;
            font-weight: 600;
        }
        .nav-links a.active {
            color: var(--ink);
            border-color: var(--accent);
        }
        .nav-actions {
            display: flex;
            gap: 12px;
            align-items: center;
        }
        .btn {
            border: 1px solid var(--stroke);
            padding: 8px 16px;
            border-radius: 999px;
            background: var(--surface);
            font-weight: 600;
            color: var(--ink);
            cursor: pointer;
        }
        .content {
            background: var(--surface);
            border: 1px solid var(--stroke);
            border-radius: 18px;
            padding: 28px;
            box-shadow: 0 14px 28px rgba(15, 23, 42, 0.08);
        }
        .page-title {
            font-family: "Space Grotesk", sans-serif;
            font-size: 28px;
            margin: 0 0 8px;
        }
        .page-sub {
            color: var(--muted);
            margin: 0 0 24px;
        }
        .helper-text {
            color: var(--muted);
            font-size: 13px;
        }
    </style>
    {% block extra_styles %}{% endblock %}
</head>
<body>
    <div class="page">
        <nav class="nav">
            <a class="brand" href="{% url 'admin_dashboard' %}">
                <span class="brand-badge">RM</span>
                Admin Portal
            </a>
            <div class="nav-links">
                <a href="{% url 'admin_dashboard' %}" {% if request.path == '/admin-portal/' %}class="active"{% endif %}>Requests</a>
                <a href="{% url 'admin_users' %}" {% if 'admin-portal/users' in request.path %}class="active"{% endif %}>Users</a>
                <a href="{% url 'admin_projects' %}" {% if 'admin-portal/projects' in request.path %}class="active"{% endif %}>Projects</a>
                <a href="{% url 'admin_plans' %}" {% if 'admin-portal/plans' in request.path %}class="active"{% endif %}>Plans</a>
            </div>
            <div class="nav-actions">
                <form method="post" action="{% url 'logout' %}">
                {% csrf_token %}
                <button type="submit" class="btn">Sign out</button>
                </form>
            </div>
        </nav>

        <main class="content">
            {% block content %}{% endblock %}
        </main>
    </div>
</body>
</html>
